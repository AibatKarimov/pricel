<style>
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --surface-2: #EAEDF2;
    --ink: #1A2130;
    --ink-soft: #5B6472;
    --ink-faint: #8991A0;
    --border: #DDE1E8;
    --border-soft: #E7EAEF;
    --accent: #3355E0;
    --accent-ink: #FFFFFF;
    --accent-soft: #E7EBFC;
    --accent-soft-ink: #2843C4;
    --done: #1F8C57;
    --done-soft: #E4F5EB;
    --doing: #B9700A;
    --doing-soft: #FBEEDA;
    --todo: #6B7486;
    --todo-soft: #E9EBF0;
    --idea: #7B4FE0;
    --idea-soft: #EFE8FD;
    --danger: #C93A52;
    --danger-soft: #FBE7EA;
    --proj-0: hsl(30, 55%, 35%); --proj-0-soft: hsl(30, 55%, 93%);
    --proj-1: hsl(82, 55%, 30%); --proj-1-soft: hsl(82, 55%, 93%);
    --proj-2: hsl(115, 45%, 33%); --proj-2-soft: hsl(115, 45%, 93%);
    --proj-3: hsl(167, 55%, 28%); --proj-3-soft: hsl(167, 55%, 93%);
    --proj-4: hsl(200, 55%, 35%); --proj-4-soft: hsl(200, 55%, 93%);
    --proj-5: hsl(252, 50%, 45%); --proj-5-soft: hsl(252, 50%, 94%);
    --proj-6: hsl(305, 45%, 38%); --proj-6-soft: hsl(305, 45%, 94%);
    --proj-7: hsl(337, 55%, 40%); --proj-7-soft: hsl(337, 55%, 94%);
    --shadow: 0 1px 2px rgba(24, 31, 51, 0.06), 0 6px 20px -8px rgba(24, 31, 51, 0.12);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131B;
      --surface: #171B25;
      --surface-2: #1D2230;
      --ink: #E7E9F0;
      --ink-soft: #9AA2B4;
      --ink-faint: #6B7386;
      --border: #2A3040;
      --border-soft: #232838;
      --accent: #7690FF;
      --accent-ink: #0E1424;
      --accent-soft: #1E2542;
      --accent-soft-ink: #AEBCFF;
      --done: #3FBE7E;
      --done-soft: #163024;
      --doing: #E8964A;
      --doing-soft: #33260F;
      --todo: #9099AE;
      --todo-soft: #232838;
      --idea: #AF8CFA;
      --idea-soft: #241D3D;
      --danger: #F0687D;
      --danger-soft: #331A22;
      --proj-0: hsl(30, 70%, 72%); --proj-0-soft: hsl(30, 40%, 18%);
      --proj-1: hsl(82, 55%, 68%); --proj-1-soft: hsl(82, 35%, 16%);
      --proj-2: hsl(115, 45%, 65%); --proj-2-soft: hsl(115, 30%, 15%);
      --proj-3: hsl(167, 55%, 62%); --proj-3-soft: hsl(167, 35%, 14%);
      --proj-4: hsl(200, 65%, 68%); --proj-4-soft: hsl(200, 40%, 16%);
      --proj-5: hsl(252, 70%, 78%); --proj-5-soft: hsl(252, 35%, 19%);
      --proj-6: hsl(305, 55%, 72%); --proj-6-soft: hsl(305, 30%, 17%);
      --proj-7: hsl(337, 65%, 74%); --proj-7-soft: hsl(337, 35%, 17%);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -10px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10131B;
    --surface: #171B25;
    --surface-2: #1D2230;
    --ink: #E7E9F0;
    --ink-soft: #9AA2B4;
    --ink-faint: #6B7386;
    --border: #2A3040;
    --border-soft: #232838;
    --accent: #7690FF;
    --accent-ink: #0E1424;
    --accent-soft: #1E2542;
    --accent-soft-ink: #AEBCFF;
    --done: #3FBE7E;
    --done-soft: #163024;
    --doing: #E8964A;
    --doing-soft: #33260F;
    --todo: #9099AE;
    --todo-soft: #232838;
    --idea: #AF8CFA;
    --idea-soft: #241D3D;
    --danger: #F0687D;
    --danger-soft: #331A22;
    --proj-0: hsl(30, 70%, 72%); --proj-0-soft: hsl(30, 40%, 18%);
    --proj-1: hsl(82, 55%, 68%); --proj-1-soft: hsl(82, 35%, 16%);
    --proj-2: hsl(115, 45%, 65%); --proj-2-soft: hsl(115, 30%, 15%);
    --proj-3: hsl(167, 55%, 62%); --proj-3-soft: hsl(167, 35%, 14%);
    --proj-4: hsl(200, 65%, 68%); --proj-4-soft: hsl(200, 40%, 16%);
    --proj-5: hsl(252, 70%, 78%); --proj-5-soft: hsl(252, 35%, 19%);
    --proj-6: hsl(305, 55%, 72%); --proj-6-soft: hsl(305, 30%, 17%);
    --proj-7: hsl(337, 65%, 74%); --proj-7-soft: hsl(337, 35%, 17%);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -10px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--accent); }
  .tabular { font-variant-numeric: tabular-nums; }

  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  #app-inner { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 272px;
    flex: 0 0 272px;
    background: var(--surface-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  .brand-mark { flex: none; color: var(--accent); }
  .brand-text h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-text p { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-faint); }

  .today-nav-wrap { padding: 10px 10px 0; display: flex; flex-direction: column; gap: 2px; }
  .today-nav {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .today-nav:hover { background: var(--surface); }
  .today-nav.active { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .today-nav-count {
    margin-left: auto;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 100px;
  }
  .today-nav.active .today-nav-count { background: var(--accent-soft-ink); color: var(--accent-soft); }

  .project-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .project-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 7px;
    position: relative;
  }
  .project-btn {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    background: transparent;
    border: none;
    text-align: left;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
    color: var(--ink);
  }
  .project-btn:hover { background: var(--surface); }
  .project-row.active .project-btn { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .project-name {
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .project-meta { font-size: 11px; color: var(--ink-faint); }
  .project-row.active .project-meta { color: var(--accent-soft-ink); opacity: 0.75; }
  .project-del {
    flex: none;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--ink-faint);
    cursor: pointer;
    opacity: 0.5;
    margin-right: 4px;
  }
  .project-row:hover .project-del, .project-del:focus-visible { opacity: 1; }
  .project-del:hover { background: var(--danger-soft); color: var(--danger); opacity: 1; }

  .add-project { padding: 8px; }
  .add-project-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 7px;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-project-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-project-form { display: flex; gap: 6px; }
  .add-project-form input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 8px 9px;
    border-radius: 7px;
    border: 1px solid var(--accent);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
  }
  .add-project-form button {
    flex: none;
    padding: 0 12px;
    border: none;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .sidebar-footer {
    border-top: 1px solid var(--border-soft);
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .io-row { display: flex; gap: 6px; }
  .io-btn {
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 7px 8px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .io-btn:hover { border-color: var(--accent); color: var(--accent); }
  .io-btn-icon { flex: 0 0 auto; padding: 7px 9px; }
  .save-status { font-size: 10.5px; color: var(--ink-faint); }
  .save-hint { font-size: 10.5px; color: var(--ink-faint); line-height: 1.4; }

  /* ---------- Lock screen ---------- */
  .lock-screen {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .lock-card {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }
  .lock-card .brand-mark { color: var(--accent); margin-bottom: 4px; }
  .lock-card h1 { font-size: 19px; font-weight: 700; }
  .lock-card p { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); }
  .lock-card input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    text-align: center;
    letter-spacing: 0.1em;
    font-size: 15px;
  }
  .lock-card input:focus-visible { border-color: var(--accent); }
  .lock-card button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .lock-error { color: var(--danger); font-size: 12px; margin-top: 8px; }

  /* ---------- Mobile top bar ---------- */
  .mobile-bar { display: none; }

  /* ---------- Main ---------- */
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }

  .main-header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px 0;
  }
  .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .project-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 3px 6px;
    margin-left: -7px;
    min-width: 80px;
    max-width: 60ch;
  }
  .project-title:hover { border-color: var(--border); }
  .project-title:focus-visible { border-color: var(--accent); outline: none; background: var(--surface); }

  .stat-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: 100px;
    background: var(--surface-2);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip b { font-variant-numeric: tabular-nums; color: var(--ink); }

  .tabs { display: flex; gap: 4px; }
  .tab-btn {
    padding: 9px 4px;
    margin-right: 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { padding: 20px 28px 60px; flex: 1 1 auto; }

  /* ---------- Today page ---------- */
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .page-subtitle { margin: 4px 0 18px; font-size: 13px; color: var(--ink-soft); }
  .today-group { max-width: 640px; margin-bottom: 22px; }
  .today-group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 4px 0 10px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .today-group-head:hover { color: var(--accent); }
  .today-group-count { margin-left: auto; font-family: var(--font-mono); font-weight: 600; color: var(--ink-faint); }

  /* ---------- Week page ---------- */
  .week-nav { display: flex; align-items: center; gap: 10px; margin: 10px 0 18px; }
  .week-nav-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .week-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .week-range { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .week-nav-today {
    border: none; background: var(--accent-soft); color: var(--accent-soft-ink);
    font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 100px; cursor: pointer;
  }
  .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .week-day {
    min-width: 0;
    min-height: 90px;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    background: var(--surface);
    padding: 8px;
  }
  .week-day.is-weekend { background: var(--surface-2); }
  .week-day.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .week-day-head {
    display: flex; flex-direction: column; gap: 1px;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border-soft);
  }
  .week-day-name { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
  .week-day.is-today .week-day-name { color: var(--accent); }
  .week-day-num { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); font-family: var(--font-mono); }
  .week-day-body { display: flex; flex-direction: column; gap: 7px; }
  .week-task { display: flex; align-items: flex-start; gap: 6px; }
  .week-task-dot {
    flex: none; width: 14px; height: 14px; margin-top: 1px;
    border-radius: 50%; border: none; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .week-task-dot svg { width: 9px; height: 9px; }
  .week-task-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .task-project-badge {
    align-self: flex-start;
    max-width: 100%;
    padding: 1px 6px;
    border-radius: 4px;
    border: none;
    font-size: 9.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .week-task-title { font-size: 11.5px; line-height: 1.35; color: var(--ink); word-break: break-word; }
  .week-task.status-done .week-task-title { text-decoration: line-through; color: var(--ink-faint); }
  .week-add-btn {
    margin-top: 8px;
    display: flex; align-items: center; gap: 4px;
    background: transparent; border: 1px dashed var(--border);
    border-radius: 6px; padding: 4px 7px;
    font-size: 10.5px; font-weight: 600; color: var(--ink-faint);
    cursor: pointer; width: 100%; justify-content: center;
  }
  .week-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .week-add-form { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .week-add-form input, .week-add-form select {
    width: 100%;
    padding: 5px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 11px;
  }
  .week-add-form input:focus-visible, .week-add-form select:focus-visible { border-color: var(--accent); }
  .week-add-row { display: flex; gap: 5px; }
  .week-add-row button { flex: 1 1 0; padding: 5px 4px; border-radius: 6px; font-size: 10.5px; font-weight: 600; cursor: pointer; }
  .week-add-row button[type="submit"] { border: none; background: var(--accent); color: var(--accent-ink); }
  .week-add-row button[type="button"] { border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); }

  /* ---------- Board ---------- */
  .add-task-bar { margin-bottom: 18px; max-width: 640px; }
  .add-task-bar form { display: flex; gap: 8px; }
  .add-task-bar input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .add-task-bar input:focus-visible { border-color: var(--accent); }
  .add-task-bar button {
    flex: none;
    padding: 0 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .add-task-bar button:hover { filter: brightness(1.06); }
  .add-task-bar input[type="date"].add-task-deadline {
    flex: 0 0 152px;
    color: var(--ink-soft);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  .column-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 2px 2px 10px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .column-head .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .column-head .count { margin-left: auto; font-family: var(--font-mono); font-weight: 600; color: var(--ink-faint); }

  .card-list { display: flex; flex-direction: column; gap: 8px; min-height: 8px; }
  .task-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 8px;

  /* ---------- Ideas & Links ---------- */

  /* ---------- Empty states ---------- */

<div id="app">
  <div id="app-inner"></div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "pricel.v1";
  var LOCK_KEY = "pricel.unlocked";
  var PASSWORD = "8691";
  var uiActiveTab = "board";
  var uiAddProjectOpen = false;
  var uiView = "today";
  var uiWeekOffset = 0;
  var uiWeekAddOpenDate = null;
  var downloadsApi = null;

  var STATUS_LABEL = { todo: "К выполнению", doing: "В работе", done: "Готово" };
  var STATUS_COLOR_VAR = { todo: "--todo", doing: "--doing", done: "--done" };

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function nowIso() { return new Date().toISOString(); }
  function dateToStamp(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function todayStamp() { return dateToStamp(new Date()); }
  var WEEKDAY_LABELS = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
  function getWeekDates(offsetWeeks) {
    var d = new Date();
    var day = d.getDay();
    var diffToMonday = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diffToMonday + offsetWeeks * 7);
    d.setHours(0, 0, 0, 0);
    var dates = [];
    for (var i = 0; i < 7; i++) {
      var x = new Date(d);
      x.setDate(x.getDate() + i);
      dates.push(x);
    }
    return dates;
  }
  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    } catch (e) { return ""; }
  }
  function formatTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  function formatDeadline(dateStr) {
    try {
      var d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
    } catch (e) { return dateStr; }
  }
  function deadlineState(task) {
    if (!task.deadline) return "none";
    if (task.status === "done") return "done";
    if (task.deadline < todayStamp()) return "overdue";
    if (task.deadline === todayStamp()) return "today";
    return "upcoming";
  }
  var PROJECT_COLOR_COUNT = 8;
  function getProjectColorIdx(p) {
    if (typeof p.colorIdx === "number") return p.colorIdx;
    return state.projects.indexOf(p) % PROJECT_COLOR_COUNT;
  }
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function sanitizeUrl(raw) {
    var url = String(raw || "").trim();
    if (!url) return "";
    if (/^https?:\/\//i.test(url)) return url;
    if (/^[a-z][a-z0-9+.\-]*:/i.test(url)) return null;
    return "https://" + url;
  }
  function hostnameOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; }
  }

  /* ---------- Lock screen ---------- */
  function isUnlocked() {
    try { return localStorage.getItem(LOCK_KEY) === "1"; } catch (e) { return false; }
  }
  function setUnlocked(v) {
    try {
      if (v) localStorage.setItem(LOCK_KEY, "1");
      else localStorage.removeItem(LOCK_KEY);
    } catch (e) {}
  }
  function renderLockScreen(errorMsg) {
    document.getElementById("app-inner").innerHTML = '' +
      '<div class="lock-screen">' +
        '<form class="lock-card" data-action="unlock-form">' +
          '<span class="brand-mark">' + ICONS.target + '</span>' +
          '<h1>Прицел</h1>' +
          '<p>Введите пароль, чтобы открыть трекер</p>' +
          '<input type="password" inputmode="numeric" name="password" placeholder="Пароль" autofocus />' +
          (errorMsg ? '<div class="lock-error">' + escapeHtml(errorMsg) + '</div>' : '') +
          '<button type="submit">Войти</button>' +
        '</form>' +
      '</div>';
    var root = document.getElementById("app-inner");
    root.addEventListener("submit", function onLockSubmit(e) {
      var form = e.target.closest('[data-action="unlock-form"]');
      if (!form) return;
      e.preventDefault();
      var entered = form.elements["password"].value;
      if (entered === PASSWORD) {
        setUnlocked(true);
        root.removeEventListener("submit", onLockSubmit);
        render();
      } else {
        renderLockScreen("Неверный пароль");
      }
    });
  }
  function lockApp() {
    setUnlocked(false);
    renderLockScreen();
  }

  /* ---------- State ---------- */
  var state = loadState();

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { projects: [], activeId: null };
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.projects)) return { projects: [], activeId: null };
      return parsed;
    } catch (e) {
      return { projects: [], activeId: null };
    }
  }
  var lastSavedAt = null;
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      lastSavedAt = new Date();
    } catch (e) {
      showToast("Не удалось сохранить локально — освободите место в браузере.");
    }
  }
  function activeProject() {
    return state.projects.find(function (p) { return p.id === state.activeId; }) || null;
  }
  function projectStats(p) {
    var total = p.tasks.length;
    var done = p.tasks.filter(function (t) { return t.status === "done"; }).length;
    var doing = p.tasks.filter(function (t) { return t.status === "doing"; }).length;
    var todo = p.tasks.filter(function (t) { return t.status === "todo"; }).length;
    return { total: total, done: done, doing: doing, todo: todo };
  }

  /* ---------- Toasts ---------- */
  function showToast(message, undoFn) {
    var container = document.getElementById("toasts");
    var el = document.createElement("div");
    el.className = "toast";
    var text = document.createElement("span");
    text.textContent = message;
    el.appendChild(text);
    var timer;
    if (undoFn) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Отменить";
      btn.addEventListener("click", function () {
        clearTimeout(timer);
        el.remove();
        undoFn();
      });
      el.appendChild(btn);
    }
    container.appendChild(el);
    timer = setTimeout(function () { el.remove(); }, 6000);
  }

  /* ---------- Mutations ---------- */
  function createProject(name) {
    var p = { id: uid(), name: name.trim() || "Без названия", createdAt: nowIso(), colorIdx: state.projects.length % PROJECT_COLOR_COUNT, tasks: [], ideas: [], links: [] };
    state.projects.push(p);
    state.activeId = p.id;
    uiActiveTab = "board";
    uiView = "project";
    save(); render();
  }
  function deleteProject(id) {
    var idx = state.projects.findIndex(function (p) { return p.id === id; });
    if (idx === -1) return;
    var removed = state.projects[idx];
    var wasActive = state.activeId === id;
    state.projects.splice(idx, 1);
    if (wasActive) state.activeId = state.projects.length ? state.projects[0].id : null;
    save(); render();
    showToast('Проект «' + removed.name + '» удалён', function () {
      state.projects.splice(idx, 0, removed);
      state.activeId = removed.id;
      save(); render();
    });
  }
  function renameProject(id, name) {
    var p = state.projects.find(function (x) { return x.id === id; });
    if (!p) return;
    var clean = name.trim();
    if (clean) p.name = clean;
    save(); render();
  }
  function addTask(projectId, title, deadline) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p || !title.trim()) return;
    p.tasks.unshift({ id: uid(), title: title.trim(), status: "todo", createdAt: nowIso(), completedAt: null, deadline: deadline || null });
    save(); render();
  }
  function setTaskStatus(projectId, taskId, status) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var t = p.tasks.find(function (x) { return x.id === taskId; });
    if (!t) return;
    var prevStatus = t.status;
    var prevCompletedAt = t.completedAt;
    t.status = status;
    t.completedAt = status === "done" ? nowIso() : null;
    save(); render();
    showToast("Задача перемещена: " + STATUS_LABEL[status], function () {
      t.status = prevStatus; t.completedAt = prevCompletedAt; save(); render();
    });
  }
  function setTaskDeadline(projectId, taskId, deadline) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var t = p.tasks.find(function (x) { return x.id === taskId; });
    if (!t) return;
    t.deadline = deadline || null;
    save(); render();
  }
  function cycleTaskStatus(projectId, taskId) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var t = p.tasks.find(function (x) { return x.id === taskId; });
    if (!t) return;
    var order = ["todo", "doing", "done"];
    var next = order[(order.indexOf(t.status) + 1) % order.length];
    setTaskStatus(projectId, taskId, next);
  }
  function deleteTask(projectId, taskId) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var idx = p.tasks.findIndex(function (x) { return x.id === taskId; });
    if (idx === -1) return;
    var removed = p.tasks[idx];
    p.tasks.splice(idx, 1);
    save(); render();
    showToast("Задача удалена", function () {
      p.tasks.splice(idx, 0, removed); save(); render();
    });
  }
  function addIdea(projectId, text) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p || !text.trim()) return;
    p.ideas.unshift({ id: uid(), text: text.trim(), createdAt: nowIso() });
    save(); render();
  }
  function deleteIdea(projectId, ideaId) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var idx = p.ideas.findIndex(function (x) { return x.id === ideaId; });
    if (idx === -1) return;
    var removed = p.ideas[idx];
    p.ideas.splice(idx, 1);
    save(); render();
    showToast("Идея удалена", function () {
      p.ideas.splice(idx, 0, removed); save(); render();
    });
  }
  function ideaToTask(projectId, ideaId) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var idx = p.ideas.findIndex(function (x) { return x.id === ideaId; });
    if (idx === -1) return;
    var idea = p.ideas[idx];
    p.ideas.splice(idx, 1);
    p.tasks.unshift({ id: uid(), title: idea.text, status: "todo", createdAt: nowIso() });
    uiActiveTab = "board";
    save(); render();
    showToast("Идея перенесена в задачи");
  }
  function addLink(projectId, title, rawUrl) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var url = sanitizeUrl(rawUrl);
    if (url === null) { showToast("Ссылка должна начинаться с http:// или https://"); return; }
    if (!url) { showToast("Укажите ссылку"); return; }
    p.links.unshift({ id: uid(), title: title.trim() || hostnameOf(url), url: url, createdAt: nowIso() });
    save(); render();
  }
  function deleteLink(projectId, linkId) {
    var p = state.projects.find(function (x) { return x.id === projectId; });
    if (!p) return;
    var idx = p.links.findIndex(function (x) { return x.id === linkId; });
    if (idx === -1) return;
    var removed = p.links[idx];
    p.links.splice(idx, 1);
    save(); render();
    showToast("Ссылка удалена", function () {
      p.links.splice(idx, 0, removed); save(); render();
    });
  }

  /* ---------- Export / Import ---------- */
  function handleExport() {
    var data = JSON.stringify(state, null, 2);
    var filename = "pricel-backup-" + todayStamp() + ".json";
    if (downloadsApi) {
      downloadsApi.save({ filename: filename, data: data }).then(function () {
        showToast("Резервная копия сохранена");
      }).catch(function (err) {
        if (err && err.code === "declined") { showToast("Экспорт отменён"); }
        else { fallbackCopyExport(data); }
      });
    } else {
      fallbackCopyExport(data);
    }
  }
  function fallbackCopyExport(data) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        showToast("Скачивание недоступно здесь — JSON скопирован в буфер обмена");
      }).catch(function () {
        showToast("Не удалось экспортировать данные");
      });
    } else {
      showToast("Экспорт недоступен в этом окне просмотра");
    }
  }
  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!parsed || !Array.isArray(parsed.projects)) throw new Error("bad shape");
        var prevState = deepClone(state);
        state = { projects: parsed.projects, activeId: parsed.activeId || (parsed.projects[0] ? parsed.projects[0].id : null) };
        uiActiveTab = "board";
        save(); render();
        showToast("Данные импортированы", function () { state = prevState; save(); render(); });
      } catch (e) {
        showToast("Не удалось прочитать файл — это не резервная копия «Прицела»?");
      }
    };
    reader.readAsText(file, "utf-8");
  }

  /* ---------- Icons ---------- */
  var ICONS = {
    target: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',

    trash: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 4.5H13M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5V13a1 1 0 0 0 1 1H10.5a1 1 0 0 0 1-1V4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',

    arrowLeft: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 8H3M3 8L7 4M3 8L7 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    undo: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4.5V8.5H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.6 8.5A5 5 0 1 0 5.5 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    download: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2V10.5M8 10.5L4.8 7.3M8 10.5L11.2 7.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    upload: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 10.5V2M8 2L4.8 5.2M8 2L11.2 5.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    link: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.7 9.3L9.3 6.7M6.3 4.5L7.2 3.6a2.3 2.3 0 0 1 3.3 3.3l-1 1M9.7 11.5l-.9.9a2.3 2.3 0 0 1-3.3-3.3l1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    lock: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3.5" y="7.5" width="9" height="6" rx="1.2" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7.5V5.5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    today: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 6.5H13.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 2V4.5M10.5 2V4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="10" r="1.1" fill="currentColor"/></svg>',
    week: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="3" width="13" height="10.5" rx="1.3" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 7H14.5" stroke="currentColor" stroke-width="1.1"/><path d="M4.8 3V5.1M8 3V5.1M11.2 3V5.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    projects: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 4.3a1 1 0 0 1 1-1h2.8l1.1 1.4H13a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
  };

  /* ---------- Today aggregation ---------- */
  function todayMatch(t) {
    if (t.status === "doing") return true;
    if (t.deadline && t.status !== "done" && t.deadline <= todayStamp()) return true;
    return false;
  }
  function todayRank(t) {
    var ds = deadlineState(t);
    if (ds === "overdue") return 0;
    if (ds === "today") return 1;
    return 2;
  }
  function getTodayGroups() {
    var groups = [];
    var total = 0;
    state.projects.forEach(function (p) {
      var tasks = p.tasks.filter(todayMatch).slice().sort(function (a, b) {
        var ra = todayRank(a), rb = todayRank(b);
        if (ra !== rb) return ra - rb;
        return (a.deadline || "") < (b.deadline || "") ? -1 : 1;
      });
      if (tasks.length) { groups.push({ project: p, tasks: tasks }); total += tasks.length; }
    });
    return { groups: groups, total: total };
  }

  /* ---------- Render ---------- */
  function render() {
    var root = document.getElementById("app-inner");
    root.innerHTML = renderSidebarHtml() + renderMainHtml();
    bindImportInput();
  }

  function renderProjectListHtml() {
    var rows = state.projects.map(function (p) {
      var stats = projectStats(p);
      var active = uiView === "project" && p.id === state.activeId;
      return '' +
        '<div class="project-row' + (active ? " active" : "") + '">' +
          '<button type="button" class="project-btn" data-action="select-project" data-id="' + p.id + '">' +
            '<span class="project-name">' + escapeHtml(p.name) + '</span>' +
            '<span class="project-meta tabular">' + stats.done + '/' + stats.total + ' задач · ' + p.ideas.length + ' идей</span>' +
          '</button>' +
          '<button type="button" class="project-del" data-action="delete-project" data-id="' + p.id + '" aria-label="Удалить проект ' + escapeHtml(p.name) + '">' + ICONS.trash + '</button>' +
        '</div>';
    }).join("");

    var addForm = uiAddProjectOpen
      ? '<form class="add-project-form" data-action="add-project-form"><input type="text" name="name" placeholder="Название проекта" autofocus /><button type="submit">' + ICONS.plus + '</button></form>'
      : '<button type="button" class="add-project-btn" data-action="open-add-project">' + ICONS.plus + ' Новый проект</button>';

    return '<div class="project-list">' + rows + '</div><div class="add-project">' + addForm + '</div>';
  }

  function renderIoFooterHtml(includeFileInput) {
    var savedLabel = lastSavedAt ? "Сохранено · " + formatTime(lastSavedAt.toISOString()) : "Ещё не сохранялось";
    return '' +
      '<div class="io-row">' +
        '<button type="button" class="io-btn" data-action="export">' + ICONS.download + ' Экспорт</button>' +
        '<button type="button" class="io-btn" data-action="import">' + ICONS.upload + ' Импорт</button>' +
        '<button type="button" class="io-btn io-btn-icon" data-action="lock-app" aria-label="Заблокировать">' + ICONS.lock + '</button>' +
        (includeFileInput ? '<input type="file" id="import-input" accept="application/json,.json" class="sr-only" />' : "") +
      '</div>' +
      '<div class="save-status tabular">' + savedLabel + '</div>' +
      '<div class="save-hint">Данные хранятся в этом браузере. Чтобы перенести их на другое устройство — экспортируйте файл и импортируйте его там.</div>';
  }

  function renderSidebarHtml() {
    var todayTotal = getTodayGroups().total;
    return '' +
      '<div class="sidebar" id="sidebar">' +
        '<div class="brand">' +
          '<span class="brand-mark">' + ICONS.target + '</span>' +
          '<div class="brand-text"><h1>Прицел</h1><p>задачи по таргету</p></div>' +
        '</div>' +
        '<div class="today-nav-wrap">' +
          '<button type="button" class="today-nav' + (uiView === "today" ? " active" : "") + '" data-action="view-today">' +
            ICONS.today + '<span class="today-nav-label">Сегодня</span>' +
            (todayTotal ? '<span class="today-nav-count tabular">' + todayTotal + '</span>' : '') +
          '</button>' +
          '<button type="button" class="today-nav' + (uiView === "week" ? " active" : "") + '" data-action="view-week">' +
            ICONS.week + '<span class="today-nav-label">Неделя</span>' +
          '</button>' +
        '</div>' +
        renderProjectListHtml() +
        '<div class="sidebar-footer">' + renderIoFooterHtml(true) + '</div>' +
      '</div>';
  }

  function renderTodayHtml() {
    var mobileBar = '' +
      '<div class="mobile-bar">' +
        '<span class="mobile-title">Сегодня</span>' +
      '</div>';
    var dateLabel = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    var data = getTodayGroups();
    var body;
    if (!data.groups.length) {
      body = '' +
        '<div class="empty-state">' +
          '<span class="brand-mark">' + ICONS.today + '</span>' +
          '<h2>На сегодня ничего не горит</h2>' +
          '<p>Здесь появятся задачи с дедлайном сегодня или просроченные, а также всё, что сейчас «в работе» — по всем проектам сразу.</p>' +
        '</div>';
    } else {
      body = data.groups.map(function (g) {
        return '' +
          '<div class="today-group">' +
            '<button type="button" class="today-group-head" data-action="select-project" data-id="' + g.project.id + '">' +
              escapeHtml(g.project.name) + '<span class="today-group-count tabular">' + g.tasks.length + '</span>' +
            '</button>' +
            '<div class="card-list">' + g.tasks.map(function (t) { return renderTaskCard(g.project, t); }).join("") + '</div>' +
          '</div>';
      }).join("");
    }
    return '<div class="main">' + mobileBar +
      '<div class="main-header">' +
        '<h1 class="page-title">Сегодня</h1>' +
        '<p class="page-subtitle">' + dateLabel + ' · дедлайны и всё, что в работе</p>' +
      '</div>' +
      '<div class="content">' + body + '</div>' +
    '</div>';
  }

  function renderWeekTaskChip(p, t) {
    var colorIdx = getProjectColorIdx(p);
    var dotContent = t.status === "done" ? ICONS.check : "";
    return '' +
      '<div class="week-task status-' + t.status + '">' +
        '<button type="button" class="week-task-dot" data-action="cycle-task-status" data-pid="' + p.id + '" data-tid="' + t.id + '" style="background:var(' + STATUS_COLOR_VAR[t.status] + ')" aria-label="Изменить статус: ' + escapeHtml(t.title) + '">' + dotContent + '</button>' +
        '<div class="week-task-body">' +
          '<button type="button" class="task-project-badge" data-action="select-project" data-id="' + p.id + '" style="background:var(--proj-' + colorIdx + '-soft);color:var(--proj-' + colorIdx + ')">' + escapeHtml(p.name) + '</button>' +
          '<span class="week-task-title">' + escapeHtml(t.title) + '</span>' +
        '</div>' +
      '</div>';
  }

  function renderWeekHtml() {
    var mobileBar = '' +
      '<div class="mobile-bar">' +
        '<span class="mobile-title">Неделя</span>' +
      '</div>';
    var dates = getWeekDates(uiWeekOffset);
    var todayStr = todayStamp();
    var rangeLabel = formatDeadline(dateToStamp(dates[0])) + " – " + formatDeadline(dateToStamp(dates[6]));

    var dayBlocks = dates.map(function (d, i) {
      var dStr = dateToStamp(d);
      var isToday = dStr === todayStr;
      var isWeekend = i >= 5;
      var items = [];
      state.projects.forEach(function (p) {
        p.tasks.forEach(function (t) {
          if (t.deadline === dStr) items.push({ project: p, task: t });
        });
      });
      items.sort(function (a, b) { return getProjectColorIdx(a.project) - getProjectColorIdx(b.project); });
      var tasksHtml = items.map(function (it) { return renderWeekTaskChip(it.project, it.task); }).join("");

      var addOpen = uiWeekAddOpenDate === dStr;
      var addHtml = addOpen
        ? '' +
          '<form class="week-add-form" data-action="week-add-task-form" data-date="' + dStr + '">' +
            '<input type="text" name="title" placeholder="Задача…" autofocus />' +
            '<select name="projectId" aria-label="Проект">' +
              state.projects.map(function (p) { return '<option value="' + p.id + '"' + (p.id === state.activeId ? " selected" : "") + '>' + escapeHtml(p.name) + '</option>'; }).join("") +
            '</select>' +
            '<div class="week-add-row">' +
              '<button type="submit">Добавить</button>' +
              '<button type="button" data-action="week-cancel-add">Отмена</button>' +
            '</div>' +
          '</form>'
        : '<button type="button" class="week-add-btn" data-action="week-open-add" data-date="' + dStr + '">' + ICONS.plus + ' Задача</button>';

      return '' +
        '<div class="week-day' + (isToday ? " is-today" : "") + (isWeekend ? " is-weekend" : "") + '">' +
          '<div class="week-day-head">' +
            '<span class="week-day-name">' + WEEKDAY_LABELS[i] + '</span>' +
            '<span class="week-day-num tabular">' + formatDeadline(dStr) + '</span>' +
          '</div>' +
          '<div class="week-day-body">' + tasksHtml + '</div>' +
          addHtml +
        '</div>';
    }).join("");

    return '<div class="main">' + mobileBar +
      '<div class="main-header">' +
        '<h1 class="page-title">Неделя</h1>' +
        '<div class="week-nav">' +
          '<button type="button" class="week-nav-btn" data-action="week-prev" aria-label="Предыдущая неделя">' + ICONS.arrowLeft + '</button>' +
          '<span class="week-range tabular">' + rangeLabel + '</span>' +
          '<button type="button" class="week-nav-btn" data-action="week-next" aria-label="Следующая неделя">' + ICONS.arrowRight + '</button>' +
          (uiWeekOffset !== 0 ? '<button type="button" class="week-nav-today" data-action="week-today">Сегодня</button>' : "") +
        '</div>' +
      '</div>' +
      '<div class="content"><div class="week-grid">' + dayBlocks + '</div></div>' +
    '</div>';
  }

  function renderProjectsHtml() {
    var mobileBar = '<div class="mobile-bar"><span class="mobile-title">Проекты</span></div>';
    return '<div class="main">' + mobileBar +
      '<div class="main-header"><h1 class="page-title">Проекты</h1></div>' +
      '<div class="content projects-page">' +
        renderProjectListHtml() +
        '<div class="projects-io">' + renderIoFooterHtml(false) + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderBottomTabsHtml() {
    var todayTotal = getTodayGroups().total;
    var tabs = [
      { view: "today", icon: ICONS.today, label: "Сегодня", badge: todayTotal },
      { view: "week", icon: ICONS.week, label: "Неделя" },
      { view: "projects", icon: ICONS.projects, label: "Проекты" }
    ];
    var activeView = uiView === "project" ? "projects" : uiView;
    return '<nav class="bottom-tabs">' +
      tabs.map(function (t) {
        return '' +
          '<button type="button" class="bottom-tab' + (activeView === t.view ? " active" : "") + '" data-action="bottom-tab" data-view="' + t.view + '">' +
            '<span class="bottom-tab-icon">' + t.icon + (t.badge ? '<span class="bottom-tab-badge tabular">' + t.badge + '</span>' : "") + '</span>' +
            '<span>' + t.label + '</span>' +
          '</button>';
      }).join("") +
    '</nav>';
  }

  function renderMainHtml() {
    var pageHtml;
    if (uiView === "today" && state.projects.length) pageHtml = renderTodayHtml();
    else if (uiView === "week" && state.projects.length) pageHtml = renderWeekHtml();
    else if (uiView === "projects" && state.projects.length) pageHtml = renderProjectsHtml();
    else pageHtml = renderProjectDetailHtml();
    return pageHtml + renderBottomTabsHtml();
  }

  function renderProjectDetailHtml() {
    var p = activeProject();
    var mobileBar = '' +
      '<div class="mobile-bar">' +
        '<span class="mobile-title">' + (p ? escapeHtml(p.name) : "Прицел") + '</span>' +
      '</div>';

    if (!p) {
      return '<div class="main">' + mobileBar +
        '<div class="content">' +
          '<div class="empty-state">' +
            '<span class="brand-mark">' + ICONS.target + '</span>' +
            '<h2>Начните с первого проекта</h2>' +
            '<p>Проект — это одна рекламная кампания или клиент. Внутри — доска задач, идеи и ссылки на документы.</p>' +
            '<form data-action="add-project-form">' +
              '<input type="text" name="name" placeholder="Например, «Instagram — стоматология»" />' +
              '<button type="submit">Создать</button>' +
            '</form>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    var stats = projectStats(p);
    var chips = '' +
      '<span class="chip"><span class="dot" style="background:var(--todo)"></span>К выполнению&nbsp;<b class="tabular">' + stats.todo + '</b></span>' +
      '<span class="chip"><span class="dot" style="background:var(--doing)"></span>В работе&nbsp;<b class="tabular">' + stats.doing + '</b></span>' +
      '<span class="chip"><span class="dot" style="background:var(--done)"></span>Готово&nbsp;<b class="tabular">' + stats.done + '</b></span>' +
      '<span class="chip"><span class="dot" style="background:var(--idea)"></span>Идей&nbsp;<b class="tabular">' + p.ideas.length + '</b></span>';

    var tabs = ["board", "ideas", "links"].map(function (key) {
      var labels = { board: "Доска", ideas: "Идеи", links: "Ссылки" };
      return '<button type="button" class="tab-btn' + (uiActiveTab === key ? " active" : "") + '" data-action="set-tab" data-tab="' + key + '">' + labels[key] + '</button>';
    }).join("");

    var body;
    if (uiActiveTab === "board") body = renderBoard(p);
    else if (uiActiveTab === "ideas") body = renderIdeas(p);
    else body = renderLinks(p);

    return '<div class="main">' + mobileBar +
      '<div class="main-header">' +
        '<div class="title-row">' +
          '<input type="text" class="project-title" data-action="rename-project" data-id="' + p.id + '" value="' + escapeHtml(p.name) + '" aria-label="Название проекта" />' +
        '</div>' +
        '<div class="stat-chips">' + chips + '</div>' +
        '<div class="tabs">' + tabs + '</div>' +
      '</div>' +
      '<div class="content">' + body + '</div>' +
    '</div>';
  }

  function renderBoard(p) {
    var addBar = '' +
      '<div class="add-task-bar">' +
        '<form data-action="add-task-form" data-id="' + p.id + '">' +
          '<input type="text" name="title" placeholder="Новая задача…" />' +
          '<input type="date" name="deadline" class="add-task-deadline" aria-label="Дедлайн (необязательно)" />' +
          '<button type="submit">' + ICONS.plus + ' Добавить</button>' +
        '</form>' +
      '</div>';

    var columns = ["todo", "doing", "done"].map(function (status) {
      var tasks = p.tasks.filter(function (t) { return t.status === status; });
      var cards = tasks.map(function (t) { return renderTaskCard(p, t); }).join("");
      if (!cards) cards = '<div class="empty-col">Пусто</div>';
      return '' +
        '<div class="column">' +
          '<div class="column-head"><span class="dot" style="background:var(' + STATUS_COLOR_VAR[status] + ')"></span>' + STATUS_LABEL[status] + '<span class="count tabular">' + tasks.length + '</span></div>' +
          '<div class="card-list">' + cards + '</div>' +
        '</div>';
    }).join("");

    return addBar + '<div class="board">' + columns + '</div>';
  }

  function renderTaskCard(p, t) {
    var actions = "";
    if (t.status === "todo") {
      actions = '<button type="button" class="icon-btn" data-action="task-status" data-pid="' + p.id + '" data-tid="' + t.id + '" data-status="doing">' + ICONS.arrowRight + ' Начать</button>';
    } else if (t.status === "doing") {
      actions = '' +
        '<button type="button" class="icon-btn" data-action="task-status" data-pid="' + p.id + '" data-tid="' + t.id + '" data-status="todo">' + ICONS.arrowLeft + '</button>' +
        '<button type="button" class="icon-btn primary" data-action="task-status" data-pid="' + p.id + '" data-tid="' + t.id + '" data-status="done">' + ICONS.check + ' Готово</button>';
    } else {
      actions = '<button type="button" class="icon-btn" data-action="task-status" data-pid="' + p.id + '" data-tid="' + t.id + '" data-status="doing">' + ICONS.undo + ' Вернуть</button>';
    }
    var dateText = formatDate(t.createdAt);
    if (t.status === "done" && t.completedAt) dateText += " → " + formatDate(t.completedAt);
    var dstate = deadlineState(t);
    return '' +
      '<div class="task-card">' +
        '<div class="task-title">' + escapeHtml(t.title) + '</div>' +
        '<div class="task-meta">' +
          '<span class="card-date tabular">' + dateText + '</span>' +
          '<input type="date" class="deadline-input state-' + dstate + (t.deadline ? ' has-value' : '') + '" value="' + (t.deadline || "") + '" data-action="set-deadline" data-pid="' + p.id + '" data-tid="' + t.id + '" aria-label="Дедлайн" />' +
        '</div>' +
        '<div class="card-foot">' +
          actions +
          '<button type="button" class="icon-btn danger icon-only" data-action="delete-task" data-pid="' + p.id + '" data-tid="' + t.id + '" aria-label="Удалить задачу">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>';
  }

  function renderIdeas(p) {
    var form = '' +
      '<form class="add-idea-form" data-action="add-idea-form" data-id="' + p.id + '">' +
        '<textarea name="text" rows="2" placeholder="Запишите идею — доработаете позже…"></textarea>' +
        '<div class="form-submit-row"><button type="submit">' + ICONS.plus + ' Добавить идею</button></div>' +
      '</form>';
    var items = p.ideas.map(function (idea) {
      return '' +
        '<div class="idea-card">' +
          '<span class="idea-dot"></span>' +
          '<div class="idea-body">' +
            '<div class="idea-text">' + escapeHtml(idea.text) + '</div>' +
            '<div class="idea-foot">' +
              '<span class="idea-date tabular">' + formatDate(idea.createdAt) + '</span>' +
              '<button type="button" class="icon-btn" data-action="idea-to-task" data-pid="' + p.id + '" data-iid="' + idea.id + '">' + ICONS.arrowRight + ' В задачи</button>' +
              '<button type="button" class="icon-btn danger icon-only" data-action="delete-idea" data-pid="' + p.id + '" data-iid="' + idea.id + '" aria-label="Удалить идею">' + ICONS.trash + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join("");
    if (!items) items = '<div class="empty-tab">Идей пока нет — самое время накидать пару мыслей о новых аудиториях или креативах.</div>';
    return '<div class="panel-max">' + form + '<div class="list-col">' + items + '</div></div>';
  }

  function renderLinks(p) {
    var form = '' +
      '<form class="add-link-form" data-action="add-link-form" data-id="' + p.id + '">' +
        '<div class="row"><input type="text" name="title" placeholder="Название (необязательно)" /></div>' +
        '<div class="row">' +
          '<input type="url" name="url" placeholder="https://…" style="flex:1" />' +
          '<button type="submit">' + ICONS.plus + ' Добавить</button>' +
        '</div>' +
      '</form>';
    var items = p.links.map(function (link) {
      return '' +
        '<div class="link-card">' +
          '<span class="link-dot">' + ICONS.link + '</span>' +
          '<div class="link-body">' +
            '<a class="link-title" href="' + escapeHtml(link.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(link.title) + '</a>' +
            '<span class="link-url">' + escapeHtml(link.url) + '</span>' +
            '<div class="link-foot">' +
              '<span class="link-date tabular">' + formatDate(link.createdAt) + '</span>' +
              '<button type="button" class="icon-btn danger icon-only" data-action="delete-link" data-pid="' + p.id + '" data-lid="' + link.id + '" aria-label="Удалить ссылку">' + ICONS.trash + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join("");
    if (!items) items = '<div class="empty-tab">Пока нет ссылок — добавьте бриф, медиаплан или таблицу с результатами.</div>';
    return '<div class="panel-max">' + form + '<div class="list-col">' + items + '</div></div>';
  }

  /* ---------- Events ---------- */
  function bindRootEventsOnce(root) {
    root.addEventListener("click", onClick);
    root.addEventListener("submit", onSubmit);
    root.addEventListener("change", onChange);
  }
  function bindImportInput() {
    var importInput = document.getElementById("import-input");
    if (importInput) {
      importInput.addEventListener("change", function () {
        if (importInput.files && importInput.files[0]) handleImportFile(importInput.files[0]);
        importInput.value = "";
      });
    }
  }

  function onClick(e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    switch (action) {
      case "select-project":
        state.activeId = el.getAttribute("data-id");
        uiActiveTab = "board";
        uiView = "project";
        save(); render();
        break;
      case "view-today":
        uiView = "today";
        render();
        break;
      case "view-week":
        uiView = "week";
        uiWeekOffset = 0;
        render();
        break;
      case "bottom-tab":
        uiView = el.getAttribute("data-view");
        if (uiView === "week") uiWeekOffset = 0;
        render();
        break;
      case "week-prev":
        uiWeekOffset -= 1; render();
        break;
      case "week-next":
        uiWeekOffset += 1; render();
        break;
      case "week-today":
        uiWeekOffset = 0; render();
        break;
      case "cycle-task-status":
        cycleTaskStatus(el.getAttribute("data-pid"), el.getAttribute("data-tid"));
        break;
      case "week-open-add":
        uiWeekAddOpenDate = el.getAttribute("data-date");
        render();
        var afterWeekOpen = document.querySelector(".week-add-form input");
        if (afterWeekOpen) afterWeekOpen.focus();
        break;
      case "week-cancel-add":
        uiWeekAddOpenDate = null;
        render();
        break;
      case "delete-project":
        e.stopPropagation();
        deleteProject(el.getAttribute("data-id"));
        break;
      case "open-add-project":
        uiAddProjectOpen = true; render();
        var addProjectInputs = document.querySelectorAll(".add-project-form input");
        var afterOpen = addProjectInputs[addProjectInputs.length - 1];
        if (afterOpen) afterOpen.focus();
        break;
      case "set-tab":
        uiActiveTab = el.getAttribute("data-tab"); render();
        break;
      case "task-status":
        setTaskStatus(el.getAttribute("data-pid"), el.getAttribute("data-tid"), el.getAttribute("data-status"));
        break;
      case "delete-task":
        deleteTask(el.getAttribute("data-pid"), el.getAttribute("data-tid"));
        break;
      case "idea-to-task":
        ideaToTask(el.getAttribute("data-pid"), el.getAttribute("data-iid"));
        break;
      case "delete-idea":
        deleteIdea(el.getAttribute("data-pid"), el.getAttribute("data-iid"));
        break;
      case "delete-link":
        deleteLink(el.getAttribute("data-pid"), el.getAttribute("data-lid"));
        break;
      case "export":
        handleExport();
        break;
      case "import":
        var input = document.getElementById("import-input");
        if (input) input.click();
        break;
      case "lock-app":
        lockApp();
        break;
    }
  }

  function onSubmit(e) {
    var form = e.target.closest("[data-action]");
    if (!form) return;
    e.preventDefault();
    var action = form.getAttribute("data-action");
    if (action === "add-project-form") {
      var name = form.elements["name"].value;
      uiAddProjectOpen = false;
      if (name.trim()) createProject(name);
      else render();
    } else if (action === "add-task-form") {
      addTask(form.getAttribute("data-id"), form.elements["title"].value, form.elements["deadline"].value);
    } else if (action === "week-add-task-form") {
      var weekTitle = form.elements["title"].value;
      var weekProjectId = form.elements["projectId"].value;
      var weekDate = form.getAttribute("data-date");
      uiWeekAddOpenDate = null;
      if (weekTitle.trim()) addTask(weekProjectId, weekTitle, weekDate);
      else render();
    } else if (action === "add-idea-form") {
      addIdea(form.getAttribute("data-id"), form.elements["text"].value);
    } else if (action === "add-link-form") {
      addLink(form.getAttribute("data-id"), form.elements["title"].value, form.elements["url"].value);
    }
  }

  function onChange(e) {
    var el = e.target.closest("[data-action='rename-project']");
    if (el) { renameProject(el.getAttribute("data-id"), el.value); return; }
    var dl = e.target.closest("[data-action='set-deadline']");
    if (dl) setTaskDeadline(dl.getAttribute("data-pid"), dl.getAttribute("data-tid"), dl.value);
  }

  /* ---------- Capabilities ---------- */
  function initCapabilities() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("downloads").then(function (api) {
          downloadsApi = api;
        }).catch(function () { downloadsApi = null; });
      }
    } catch (e) { downloadsApi = null; }
  }

  bindRootEventsOnce(document.getElementById("app-inner"));
  initCapabilities();
  if (isUnlocked()) render();
  else renderLockScreen();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
